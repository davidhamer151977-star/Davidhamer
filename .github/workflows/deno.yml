  input, select, button {
    background:#000; color:#0f0; border:1px solid #0f0;
    font-family:Consolas,monospace; font-size:11px; padding:2px 4px; margin:2px 0;
  }
  button { cursor:pointer; }
  .small { font-size:11px; opacity:0.85; }
  canvas { background:#000; border:1px solid #0f0; display:block; }
</style>
</head>
<body>

<div class="wrap">

  <!-- ATLAS VIEWER -->
  <div class="panel">
    <div class="title"><h2>Copyright law 1989 to 2026 made by Emmaunel david hamer enasto ENASTO 13700 • UNIFIED MEMORY ATLAS</h2></div>
    <div id="atlasSummary" class="small"></div>
    <pre id="atlasList"></pre>
  </div>

  <!-- FILTERS + DETAIL -->
  <div class="panel">
    <div class="title"><h2>FILTERS • DETAIL</h2></div>
    <div class="small">
      Tier:
      <select id="tierFilter">
        <option value="">ALL</option>
        <option value="1">OS_2026</option>
        <option value="2">BIN_6000</option>
        <option value="3">BIN_16000</option>
      </select>
      Type:
      <select id="typeFilter">
        <option value="">ALL</option>
        <option value="6">OS_EVENT</option>
        <option value="4">AI_MEMORY</option>
        <option value="8">UNIV_RITUAL</option>
      </select>
      <button id="applyFilterBtn">APPLY</button>
    </div>
    <pre id="detailView"></pre>
  </div>

  <!-- INJECT PANEL -->
  <div class="panel">
    <div class="title"><h2>INJECT • OS EVENT / AI MEMORY / UNIVERSE RITUAL</h2></div>
    <div class="small">
      Kind:
      <select id="injectKind">
        <option value="OS_EVENT">OS_EVENT</option>
        <option value="AI_MEMORY">AI_MEMORY</option>
        <option value="UNIV_RITUAL">UNIV_RITUAL</option>
      </select>
    </div>
    <div class="small">
      Region: <input id="injectRegion" value="0" style="width:60px;">
      Offset(bits): <input id="injectOffset" value="0" style="width:80px;">
      Length(bits): <input id="injectLength" value="64" style="width:80px;">
    </div>
    <div class="small">
      Payload / Note:
      <input id="injectNote" style="width:95%;" placeholder="Payload / Note">
    </div>
    <button id="injectBtn">REGISTER IN ATLAS</button>
  </div>

  <!-- BINARY VIEW -->
  <div class="panel">
    <div class="title"><h2>BINARY VIEW (LAST ENTRY)</h2></div>
    <pre id="binaryView"></pre>
  </div>

  <!-- PREVIEW SCREEN -->
  <div class="panel">
    <div class="title"><h2>PREVIEW SCREEN • LIVE BINARY STREAM</h2></div>
    <pre id="previewScreen"></pre>
  </div>

  <!-- MATRIX + BINARY ANIMATION -->
  <div class="panel">
    <div class="title"><h2>MATRIX • FALLING BITS (LAST ENTRY)</h2></div>
    <canvas id="matrixCanvas" width="320" height="180"></canvas>
  </div>

  <!-- 3D MEMORY CUBE -->
  <div class="panel">
    <div class="title"><h2>3D MEMORY CUBE • REGION/OFFSET/LENGTH</h2></div>
    <canvas id="cubeCanvas" width="320" height="180"></canvas>
  </div>

  <!-- UNIVERSE RITUAL GLYPH -->
  <div class="panel">
    <div class="title"><h2>UNIVERSE RITUAL GLYPH • NOTE SIGNATURE</h2></div>
    <canvas id="glyphCanvas" width="320" height="180"></canvas>
  </div>

  <!-- AI NEURON MAP -->
  <div class="panel">
    <div class="title"><h2>AI NEURON MAP • NOTE ACTIVATION</h2></div>
    <canvas id="neuronCanvas" width="320" height="180"></canvas>
  </div>

</div>

<script>
// ===== CONSTANTS =====
const ERA_13700 = 0x13700;
const TIER_OS_2026 = 1;
const TIER_BIN_6000 = 2;
const TIER_BIN_16000 = 3;

const TYPE_OS_EVENT = 6;
const TYPE_AI_MEMORY = 4;
const TYPE_UNIV_RITUAL = 8;

const FLAG_HOT = 1 << 0;
const FLAG_AI  = 1 << 2;
const FLAG_UNIV = 1 << 3;
const FLAG_OS = 1 << 4;
const FLAG_RIT = 1 << 6;

// ===== ADDRESS CLASS =====
class E13700Address {
  constructor(tier, subEra, type, regionId, offsetBits, lengthBits) {
    this.era = ERA_13700;
    this.tier = tier;
    this.subEra = subEra;
    this.type = type;
    this.regionId = BigInt(regionId);
    this.offsetBits = BigInt(offsetBits);
    this.lengthBits = BigInt(lengthBits);
  }
  toString() {
    return `E13700:${this.tier}:${this.subEra.toString(16)}:${this.type}:${this.regionId}:${this.offsetBits}:${this.lengthBits}`;
  }
}

// ===== ATLAS =====
class E13700AtlasEntry {
  constructor(addr, flags, hash, sourceTag, note) {
    this.addr = addr;
    this.flags = flags;
    this.hash = hash;
    this.sourceTag = sourceTag;
    this.note = note || "";
  }
}

class E13700MemoryAtlas {
  constructor() { this.entries = []; }
  add(entry) { this.entries.push(entry); return entry; }
  filtered(tier, type) {
    return this.entries.filter(e => {
      if (tier && e.addr.tier !== tier) return false;
      if (type && e.addr.type !== type) return false;
      return true;
    });
  }
}

const atlas13700 = new E13700MemoryAtlas();

// ===== HASH =====
function hashString(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return "0x" + (h >>> 0).toString(16);
}

// ===== REGISTRATION =====
function registerOsEvent(offset, note) {
  const addr = new E13700Address(TIER_OS_2026, 0x2026, TYPE_OS_EVENT, 0n, BigInt(offset), 1n);
  const hash = hashString(note);
  return atlas13700.add(new E13700AtlasEntry(addr, FLAG_HOT | FLAG_OS, hash, "OS2026", note));
}

function registerAiMemory(region, offset, length, note) {
  const addr = new E13700Address(TIER_BIN_6000, 0x3000, TYPE_AI_MEMORY, BigInt(region), BigInt(offset), BigInt(length));
  const hash = hashString(note);
  return atlas13700.add(new E13700AtlasEntry(addr, FLAG_HOT | FLAG_AI, hash, "AI", note));
}

function registerUniverseRitual(region, offset, length, note) {
  const addr = new E13700Address(TIER_BIN_6000, 0x3000, TYPE_UNIV_RITUAL, BigInt(region), BigInt(offset), BigInt(length));
  const hash = hashString(note);
  return atlas13700.add(new E13700AtlasEntry(addr, FLAG_HOT | FLAG_UNIV | FLAG_RIT, hash, "RITUAL", note));
}

// ===== UI ELEMENTS =====
const atlasSummary = document.getElementById("atlasSummary");
const atlasList = document.getElementById("atlasList");
const detailView = document.getElementById("detailView");
const binaryView = document.getElementById("binaryView");
const previewScreen = document.getElementById("previewScreen");

const tierFilter = document.getElementById("tierFilter");
const typeFilter = document.getElementById("typeFilter");
const applyFilterBtn = document.getElementById("applyFilterBtn");

const injectKind = document.getElementById("injectKind");
const injectRegion = document.getElementById("injectRegion");
const injectOffset = document.getElementById("injectOffset");
const injectLength = document.getElementById("injectLength");
const injectNote = document.getElementById("injectNote");
const injectBtn = document.getElementById("injectBtn");

// Visual canvases
const matrixCanvas = document.getElementById("matrixCanvas");
const matrixCtx = matrixCanvas.getContext("2d");
const cubeCanvas = document.getElementById("cubeCanvas");
const cubeCtx = cubeCanvas.getContext("2d");
const glyphCanvas = document.getElementById("glyphCanvas");
const glyphCtx = glyphCanvas.getContext("2d");
const neuronCanvas = document.getElementById("neuronCanvas");
const neuronCtx = neuronCanvas.getContext("2d");

let lastEntry = null;

// ===== RENDER ATLAS =====
function renderAtlas() {
  const tierVal = tierFilter.value ? parseInt(tierFilter.value) : null;
  const typeVal = typeFilter.value ? parseInt(typeFilter.value) : null;

  const list = atlas13700.filtered(tierVal, typeVal);

  atlasSummary.textContent = `Entries: ${atlas13700.entries.length}  |  Filtered: ${list.length}`;

  let out = "IDX  TIER  SUBERA  TYPE  REGION  OFFSET(bits)  LENGTH(bits)  FLAGS  SRC   HASH\n";
  out += "---------------------------------------------------------------------------------\n";

  list.forEach((e, i) => {
    const a = e.addr;
    out += `${i}    ${a.tier}     ${a.subEra.toString(16)}    ${a.type}     ${a.regionId} ${a.offsetBits} ${a.lengthBits} ${e.flags}    ${e.sourceTag} ${e.hash}\n`;
  });

  atlasList.textContent = out;
}

applyFilterBtn.addEventListener("click", renderAtlas);

// ===== INJECT =====
injectBtn.addEventListener("click", () => {
  const kind = injectKind.value;
  const region = injectRegion.value || "0";
  const offset = injectOffset.value || "0";
  const length = injectLength.value || "64";
  const note = injectNote.value || "";

  let entry;
  if (kind === "OS_EVENT") entry = registerOsEvent(offset, note);
  if (kind === "AI_MEMORY") entry = registerAiMemory(region, offset, length, note);
  if (kind === "UNIV_RITUAL") entry = registerUniverseRitual(region, offset, length, note);

  lastEntry = entry;

  // DETAIL PANEL
  detailView.textContent =
    `ADDR:\n  ERA: ${entry.addr.era}\n  TIER: ${entry.addr.tier}\n  SUBERA: 0x${entry.addr.subEra.toString(16)}\n  TYPE: ${entry.addr.type}\n  REGION: ${entry.addr.regionId}\n  OFFSET: ${entry.addr.offsetBits} bits\n  LENGTH: ${entry.addr.lengthBits} bits\n\nFLAGS: ${entry.flags}\nSOURCE: ${entry.sourceTag}\nHASH: ${entry.hash}\n\nNOTE:\n${entry.note}`;

  // BINARY VIEW
  binaryView.textContent =
    `REGION: ${entry.addr.regionId.toString(2).padStart(64,"0")}\n` +
    `OFFSET: ${entry.addr.offsetBits.toString(2).padStart(64,"0")}\n` +
    `LENGTH: ${entry.addr.lengthBits.toString(2).padStart(64,"0")}\n` +
    `FLAGS:  ${entry.flags.toString(2).padStart(16,"0")}`;

  // PREVIEW SCREEN
  previewScreen.textContent =
    `LIVE BINARY STREAM:\n\n` +
    entry.addr.regionId.toString(2).padStart(64,"0") + "\n" +
    entry.addr.offsetBits.toString(2).padStart(64,"0") + "\n" +
    entry.addr.lengthBits.toString(2).padStart(64,"0") + "\n\n" +
    `PAYLOAD:\n${entry.note}`;

  renderAtlas();
});

// ===== MATRIX ANIMATION =====
let matrixCols = Math.floor(matrixCanvas.width / 10);
let matrixDrops = Array(matrixCols).fill(0);
let matrixBits = "01";

function drawMatrix() {
  matrixCtx.fillStyle = "rgba(0,0,0,0.1)";
  matrixCtx.fillRect(0,0,matrixCanvas.width,matrixCanvas.height);
  matrixCtx.fillStyle = "#0f0";
  matrixCtx.font = "10px Consolas";

  for (let i = 0; i < matrixCols; i++) {
    let text = matrixBits[Math.floor(Math.random()*matrixBits.length)];
    if (lastEntry) {
      const stream = lastEntry.addr.regionId.toString(2) +
                     lastEntry.addr.offsetBits.toString(2) +
                     lastEntry.addr.lengthBits.toString(2);
      text = stream[(matrixDrops[i] + i) % stream.length] || "0";
    }
    matrixCtx.fillText(text, i*10, matrixDrops[i]*10);
    if (matrixDrops[i]*10 > matrixCanvas.height && Math.random() > 0.975) {
      matrixDrops[i] = 0;
    }
    matrixDrops[i]++;
  }
  requestAnimationFrame(drawMatrix);
}

// ===== 3D MEMORY CUBE =====
let cubeAngle = 0;
function drawCube() {
  cubeCtx.fillStyle = "#000";
  cubeCtx.fillRect(0,0,cubeCanvas.width,cubeCanvas.height);
  cubeCtx.strokeStyle = "#0f0";
  cubeCtx.lineWidth = 1;

  const cx = cubeCanvas.width/2;
  const cy = cubeCanvas.height/2;
  const size = 40;

  const regionNorm = lastEntry ? Number(lastEntry.addr.regionId % 64n) / 64 : 0.3;
  const offsetNorm = lastEntry ? Number(lastEntry.addr.offsetBits % 64n) / 64 : 0.6;
  const lengthNorm = lastEntry ? Number(lastEntry.addr.lengthBits % 64n) / 64 : 0.9;

  const depth = 60 + lengthNorm*40;

  const points = [
    {x:-size,y:-size,z:-size},
    {x: size,y:-size,z:-size},
    {x: size,y: size,z:-size},
    {x:-size,y: size,z:-size},
    {x:-size,y:-size,z: size},
    {x: size,y:-size,z: size},
    {x: size,y: size,z: size},
    {x:-size,y: size,z: size},
  ];

  const rotY = cubeAngle;
  const rotX = cubeAngle * 0.7;

  const projected = points.map(p => {
    let x = p.x;
    let y = p.y;
    let z = p.z;

    let xz = x*Math.cos(rotY) - z*Math.sin(rotY);
    let zz = x*Math.sin(rotY) + z*Math.cos(rotY);
    x = xz; z = zz;

    let yz = y*Math.cos(rotX) - z*Math.sin(rotX);
    zz = y*Math.sin(rotX) + z*Math.cos(rotX);
    y = yz; z = zz;

    const scale = depth / (depth + z);
    return {
      x: cx + x*scale,
      y: cy + y*scale
    };
  });

  const edges = [
    [0,1],[1,2],[2,3],[3,0],
    [4,5],[5,6],[6,7],[7,4],
    [0,4],[1,5],[2,6],[3,7]
  ];

  cubeCtx.beginPath();
  edges.forEach(e => {
    cubeCtx.moveTo(projected[e[0]].x, projected[e[0]].y);
    cubeCtx.lineTo(projected[e[1]].x, projected[e[1]].y);
  });
  cubeCtx.stroke();

  cubeCtx.fillStyle = "#0f0";
  cubeCtx.fillText("REGION:" + (lastEntry ? lastEntry.addr.regionId.toString() : "0"), 4, 12);
  cubeCtx.fillText("OFFSET:" + (lastEntry ? lastEntry.addr.offsetBits.toString() : "0"), 4, 24);
  cubeCtx.fillText("LENGTH:" + (lastEntry ? lastEntry.addr.lengthBits.toString() : "0"), 4, 36);

  cubeAngle += 0.01;
  requestAnimationFrame(drawCube);
}

// ===== UNIVERSE RITUAL GLYPH =====
function drawGlyph() {
  glyphCtx.fillStyle = "#000";
  glyphCtx.fillRect(0,0,glyphCanvas.width,glyphCanvas.height);
  glyphCtx.strokeStyle = "#0f0";
  glyphCtx.lineWidth = 1;

  const w = glyphCanvas.width;
  const h = glyphCanvas.height;
  const cx = w/2;
  const cy = h/2;

  const note = lastEntry ? lastEntry.note : "";
  const len = note.length || 1;

  glyphCtx.beginPath();
  for (let i = 0; i < len; i++) {
    const ch = note.charCodeAt(i) || 0;
    const angle = (i / len) * Math.PI * 2;
    const radius = 20 + (ch % 60);
    const x = cx + Math.cos(angle)*radius;
    const y = cy + Math.sin(angle)*radius;
    if (i === 0) glyphCtx.moveTo(x,y);
    else glyphCtx.lineTo(x,y);
  }
  glyphCtx.closePath();
  glyphCtx.stroke();

  glyphCtx.fillStyle = "#0f0";
  glyphCtx.fillText("RITUAL GLYPH", 4, 12);
  requestAnimationFrame(drawGlyph);
}

// ===== AI NEURON MAP =====
function drawNeuronMap() {
  neuronCtx.fillStyle = "#000";
  neuronCtx.fillRect(0,0,neuronCanvas.width,neuronCanvas.height);

  const w = neuronCanvas.width;
  const h = neuronCanvas.height;
  const note = lastEntry ? lastEntry.note : "";
  const len = note.length || 1;

  const neurons = 40;
  const positions = [];
  for (let i = 0; i < neurons; i++) {
    positions.push({
      x: Math.random()*w,
      y: Math.random()*h
    });
  }

  neuronCtx.strokeStyle = "#004400";
  neuronCtx.lineWidth = 1;
  for (let i = 0; i < neurons; i++) {
    for (let j = i+1; j < neurons; j++) {
      if (Math.random() < 0.05) {
        neuronCtx.beginPath();
        neuronCtx.moveTo(positions[i].x, positions[i].y);
        neuronCtx.lineTo(positions[j].x, positions[j].y);
        neuronCtx.stroke();
      }
    }
  }

  for (let i = 0; i < neurons; i++) {
    const ch = note.charCodeAt(i % len) || 0;
    const act = (ch % 255) / 255;
    const r = 2 + act*4;
    neuronCtx.beginPath();
    neuronCtx.fillStyle = `rgba(0,255,0,${0.2+act*0.8})`;
    neuronCtx.arc(positions[i].x, positions[i].y, r, 0, Math.PI*2);
    neuronCtx.fill();
  }

  neuronCtx.fillStyle = "#0f0";
  neuronCtx.fillText("AI NEURON MAP", 4, 12);
  requestAnimationFrame(drawNeuronMap);
}

// ===== START ANIMATIONS =====
renderAtlas();
drawMatrix();
drawCube();
drawGlyph();
drawNeuronMap();
</script>

</body>
</html>
