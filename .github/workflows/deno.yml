<script>
const enasto = {
  state: {
    bank: 1,
    dimension: 3,
    currentFile: null,
    config: {},
    drunkLevel: 1
  },

  log(msg) {
    const log = document.getElementById("log");
    const t = new Date().toLocaleTimeString();
    log.value += `[${t}] ${msg}\n`;
    log.scrollTop = log.scrollHeight;
  },

  setStatus(msg) {
    document.getElementById("statusLabel").textContent = msg;
  },

  setBank(n) {
    this.state.bank = Number(n);
    this.log(`Bank → ${n} (ENASTO 128 TB BASIC).`);
    this.setStatus(`Bank ${n} active.`);
  },

  setDimension(d) {
    this.state.dimension = Number(d);
    this.log(`Dimension → ${d}D.`);
    this.setStatus(`${d}D mode active.`);
  },

  setDrunkLevel(level) {
    this.state.drunkLevel = Number(level);
    this.log(`Drunk Level → ${level}`);
    this.setStatus(`Drunk Level ${level}.`);
  },

  parseEEJONSLEX() {
    const code = document.getElementById("editor").value;
    const match = code.match(/<!--EEJONSLEX([\s\S]*?)EEJONSLEX-->/);
    if (!match) {
      this.state.config = {};
      this.log("No EEJONSLEX block found.");
      return;
    }
    try {
      this.state.config = JSON.parse(match[1]);
      this.log("EEJONSLEX config loaded.");
    } catch {
      this.state.config = {};
      this.log("EEJONSLEX parse error.");
    }
  },

  runEEJS() {
    const cfg = this.state.config;
    if (cfg.ritual === "CORE_IGNITE") {
      this.log("EEJS: CORE_IGNITE ritual triggered.");
    }
    if (cfg.universe) {
      this.log(`EEJS: Universe = ${cfg.universe}.`);
    }
  },

  async save() {
    const name = prompt("Save as:", this.state.currentFile || "NEWFILE");
    if (!name) return;

    const code = document.getElementById("editor").value;

    localStorage.setItem(name + ".dhero", JSON.stringify({
      code,
      bank: this.state.bank,
      dimension: this.state.dimension,
      config: this.state.config,
      drunkLevel: this.state.drunkLevel
    }));

    this.state.currentFile = name;
    this.log(`Saved ${name}.dhero`);
    this.setStatus("Saved.");
  },

  async load() {
    const name = prompt("Load file:");
    if (!name) return;

    const raw = localStorage.getItem(name + ".dhero");
    if (!raw) {
      this.log(`File not found: ${name}.dhero`);
      return;
    }

    const file = JSON.parse(raw);

    document.getElementById("editor").value = file.code;
    document.getElementById("bankSelect").value = file.bank;
    document.getElementById("dimSelect").value = file.dimension;
    document.getElementById("drunkLevel").value = file.drunkLevel ?? 1;

    this.state.bank = file.bank;
    this.state.dimension = file.dimension;
    this.state.config = file.config || {};
    this.state.currentFile = name;
    this.state.drunkLevel = file.drunkLevel ?? 1;

    this.log(`Loaded ${name}.dhero`);
    this.setStatus("Loaded.");
  },

  run() {
    const code = document.getElementById("editor").value;

    this.parseEEJONSLEX();
    this.runEEJS();

    const dim = this.state.dimension;
    const drunk = this.state.drunkLevel || 1;

    const dimStyle = `
      <style>
        body { margin:0; font-family:system-ui; color:#e6ecff; }

        /* BASE DIMENSIONS */

        .dim3  { transform: perspective(800px) rotateY(0deg); }

        .dim4  { 
          transform: perspective(800px) rotateY(18deg);
          filter: hue-rotate(40deg);
        }

        .dim10 { 
          transform: perspective(800px) rotateY(35deg) skewX(8deg);
          filter: hue-rotate(120deg) saturate(1.4);
        }

        /* 100D — mild wobble */
        @keyframes wobble100 {
          0% { transform: perspective(800px) rotateY(0deg); }
          50% { transform: perspective(800px) rotateY(1deg) translateX(1px); }
          100% { transform: perspective(800px) rotateY(0deg); }
        }
        .dim100 {
          animation: wobble100 6s ease-in-out infinite;
          filter: hue-rotate(80deg) saturate(1.1);
        }

        /* 500D — medium warp */
        @keyframes warp500 {
          0% { transform: perspective(800px) rotateY(0deg) skewX(0deg); }
          50% { transform: perspective(800px) rotateY(5deg) skewX(3deg); }
          100% { transform: perspective(800px) rotateY(0deg) skewX(0deg); }
        }
        .dim500 {
          animation: warp500 5s ease-in-out infinite;
          filter: hue-rotate(150deg) saturate(1.3) brightness(1.05);
        }

        /* 1000D — full tipsy-space */
        @keyframes tipsy1000 {
          0% { transform: perspective(800px) rotateY(0deg) translateX(0px) skewX(0deg); }
          25% { transform: perspective(800px) rotateY(2deg) translateX(3px) skewX(1deg); }
          50% { transform: perspective(800px) rotateY(-2deg) translateX(-3px) skewX(-1deg); }
          75% { transform: perspective(800px) rotateY(1deg) translateX(2px) skewX(0.5deg); }
          100% { transform: perspective(800px) rotateY(0deg) translateX(0px) skewX(0deg); }
        }
        .dim1000 {
          animation: tipsy1000 4s ease-in-out infinite;
          filter: hue-rotate(200deg) saturate(1.8) brightness(1.1);
        }

        /* 10,000D — fractal shimmer */
        @keyframes fractal10000 {
          0% { filter: hue-rotate(0deg) blur(0px); }
          25% { filter: hue-rotate(90deg) blur(1px); }
          50% { filter: hue-rotate(180deg) blur(2px); }
          75% { filter: hue-rotate(270deg) blur(1px); }
          100% { filter: hue-rotate(360deg) blur(0px); }
        }
        .dim10000 {
          animation: fractal10000 3s linear infinite;
          transform: perspective(800px) rotateY(45deg) skewX(12deg) scale(1.05);
        }

        /* 1,000,000D — collapse + breach + gravity + portal */

        @keyframes dimensionCollapse {
          0%   { transform: scale(1) rotateY(0deg); }
          40%  { transform: scale(0.7) rotateY(20deg); }
          60%  { transform: scale(1.2) rotateY(-25deg); }
          100% { transform: scale(1) rotateY(0deg); }
        }

        @keyframes realityBreach {
          0%   { clip-path: inset(0% 0% 0% 0%); }
          30%  { clip-path: inset(5% 20% 10% 0%); }
          60%  { clip-path: inset(10% 0% 5% 25%); }
          100% { clip-path: inset(0% 0% 0% 0%); }
        }

        @keyframes gravityDrift {
          0%   { transform-origin: 50% 50%; }
          50%  { transform-origin: 50% 80%; }
          100% { transform-origin: 50% 50%; }
        }

        @keyframes portalDistortion {
          0%   { filter: contrast(1) saturate(1); }
          50%  { filter: contrast(1.6) saturate(2) blur(1px); }
          100% { filter: contrast(1) saturate(1); }
        }

        .dim1000000 {
          animation:
            dimensionCollapse 5s ease-in-out infinite,
            realityBreach 7s ease-in-out infinite,
            gravityDrift 6s ease-in-out infinite,
            portalDistortion 4s ease-in-out infinite;
          transform: perspective(1000px) rotateY(60deg) skewX(18deg) scale(1.1);
        }

        /* DRUNK LEVEL INTENSITY */

        body[data-drunk="1"] { --ripple: 1px; --sway: 1deg; }
        body[data-drunk="2"] { --ripple: 2px; --sway: 3deg; }
        body[data-drunk="3"] { --ripple: 4px; --sway: 6deg; }

        @keyframes rippleShader {
          0% { filter: drop-shadow(0 0 var(--ripple) #66aaff); }
          50% { filter: drop-shadow(0 0 calc(var(--ripple) * 2) #99ccff); }
          100% { filter: drop-shadow(0 0 var(--ripple) #66aaff); }
        }

        .ripple {
          animation: rippleShader 2s ease-in-out infinite;
        }
      </style>
    `;

    let wrapped = `
      <html>
        <head>${dimStyle}</head>
        <body class="dim${dim}" data-drunk="${drunk}">
          ${code}
        </body>
      </html>
    `;

    document.getElementById("previewFrame").srcdoc = wrapped;

    this.log(`RUN → Preview (Bank ${this.state.bank}, ${dim}D, Drunk ${drunk}).`);
    this.setStatus(`Preview updated • Bank ${this.state.bank} • ${dim}D • Drunk ${drunk}`);
  }
};

window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("editor").value =
`<!--EEJONSLEX
{
  "project": "ENASTO",
  "ritual": "CORE_IGNITE",
  "universe": "MARS"
}

EEJONSLEX-->

<h1 class="ripple">ENASTO HTMLJSCSSC++</h1>
<p>Running inside EEUKOSUI • ENASTO 128 TB BASIC SYSTEM © 1989–2026 EEUKOSUI • ENASTO SYSTEMS — ALL RIGHTS RESERVED.</p>
<p>Try switching dimensions and Drunk Level in the top bar.</p>`;

});
</script>

