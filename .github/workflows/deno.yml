<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>EEUKOSUI • ENASTO 128 TB BASIC SYSTEM</title>

<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: radial-gradient(circle at top, #1b2340, #05060a);
    color: #e6ecff;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 8px 16px;
    background: linear-gradient(90deg, #1f2a4d, #283a6b);
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    grid-template-rows: 1fr auto;
    gap: 4px;
    padding: 4px;
  }
  .panel {
    border-radius: 6px;
    background: rgba(8, 12, 28, 0.9);
    border: 1px solid rgba(120, 150, 255, 0.25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 4px 8px;
    font-size: 12px;
    background: linear-gradient(90deg, #222b4a, #1a2238);
    border-bottom: 1px solid rgba(120, 150, 255, 0.25);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .panel-body {
    flex: 1;
    display: flex;
  }
  #editor {
    width: 100%;
    height: 100%;
    background: #050712;
    color: #e6ecff;
    border: none;
    padding: 8px;
    font-family: "Fira Code", monospace;
    font-size: 13px;
    resize: none;
    outline: none;
  }
  #previewFrame {
    width: 100%;
    height: 100%;
    border: none;
    background: #02030a;
  }
  #log {
    width: 100%;
    height: 100%;
    border: none;
    background: #050712;
    color: #9fb3ff;
    font-family: "Fira Code", monospace;
    font-size: 11px;
    padding: 6px;
    resize: none;
    outline: none;
  }
  .toolbar button, .toolbar select {
    margin-left: 4px;
    padding: 2px 8px;
    font-size: 11px;
    border-radius: 4px;
    border: 1px solid rgba(150, 180, 255, 0.5);
    background: rgba(10, 18, 40, 0.9);
    color: #e6ecff;
    cursor: pointer;
  }
  footer {
    padding: 4px 8px;
    font-size: 11px;
    background: #050712;
    border-top: 1px solid rgba(120, 150, 255, 0.25);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
</style>
</head>

<body>

<header>
  <div><strong>EEUKOSUI</strong> • ENASTO 128 TB BASIC SYSTEM</div>

  <div class="toolbar">
    <label>Bank:</label>
    <select id="bankSelect" onchange="enasto.setBank(this.value)">
      <option value="0">0 • OS</option>
      <option value="1" selected>1 • HTMLJSCSSC++</option>
      <option value="2">2 • Universe</option>
      <option value="3">3 • Rituals</option>
      <option value="4">4 • Game</option>
      <option value="5">5 • FS/TRDOS</option>
      <option value="6">6 • Memory Atlas</option>
      <option value="7">7 • Lab</option>
    </select>

    <label>Dimension:</label>
    <select id="dimSelect" onchange="enasto.setDimension(this.value)">
      <option value="3">3D</option>
      <option value="4">4D</option>
      <option value="10">10D</option>
    </select>

    <button onclick="enasto.save()">Save</button>
    <button onclick="enasto.load()">Load</button>
    <button onclick="enasto.run()">Run / Preview</button>
  </div>
</header>

<main>

  <section class="panel">
    <div class="panel-header">ENASTO HTMLJSCSSC++ Editor</div>
    <div class="panel-body">
      <textarea id="editor"></textarea>
    </div>
  </section>

  <section class="panel">
    <div class="panel-header">ENASTO Preview (3D/4D/10D)</div>
    <div class="panel-body">
      <iframe id="previewFrame"></iframe>
    </div>
  </section>

  <section class="panel" style="grid-column: 1 / span 2; height: 140px;">
    <div class="panel-header">ENASTO System Log</div>
    <div class="panel-body">
      <textarea id="log" readonly></textarea>
    </div>
  </section>

</main>

<footer>
  <span id="statusLabel">Ready.</span>
  <span>HTMLJSCSSC++ • EEJONSLEX • EEJS • 3D/4D/10D</span>
</footer>

<script>
const enasto = {
  state: {
    bank: 1,
    dimension: 3,
    currentFile: null,
    config: {}
  },

  log(msg) {
    const log = document.getElementById("log");
    const t = new Date().toLocaleTimeString();
    log.value += `[${t}] ${msg}\n`;
    log.scrollTop = log.scrollHeight;
  },

  setStatus(msg) {
    document.getElementById("statusLabel").textContent = msg;
  },

  setBank(n) {
    this.state.bank = Number(n);
    this.log(`Bank → ${n} (ENASTO 128 TB BASIC).`);
    this.setStatus(`Bank ${n} active.`);
  },

  setDimension(d) {
    this.state.dimension = Number(d);
    this.log(`Dimension → ${d}D.`);
    this.setStatus(`${d}D mode active.`);
  },

  parseEEJONSLEX() {
    const code = document.getElementById("editor").value;
    const match = code.match(/<!--EEJONSLEX([\s\S]*?)EEJONSLEX-->/);
    if (!match) {
      this.state.config = {};
      this.log("No EEJONSLEX block found.");
      return;
    }
    try {
      this.state.config = JSON.parse(match[1]);
      this.log("EEJONSLEX config loaded.");
    } catch {
      this.state.config = {};
      this.log("EEJONSLEX parse error.");
    }
  },

  runEEJS() {
    const cfg = this.state.config;
    if (cfg.ritual === "CORE_IGNITE") {
      this.log("EEJS: CORE_IGNITE ritual triggered.");
    }
    if (cfg.universe) {
      this.log(`EEJS: Universe = ${cfg.universe}.`);
    }
  },

  async save() {
    const name = prompt("Save as:", this.state.currentFile || "NEWFILE");
    if (!name) return;

    const code = document.getElementById("editor").value;

    // Replace with your real FS system
    localStorage.setItem(name + ".dhero", JSON.stringify({
      code,
      bank: this.state.bank,
      dimension: this.state.dimension,
      config: this.state.config
    }));

    this.state.currentFile = name;
    this.log(`Saved ${name}.dhero`);
    this.setStatus("Saved.");
  },

  async load() {
    const name = prompt("Load file:");
    if (!name) return;

    const raw = localStorage.getItem(name + ".dhero");
    if (!raw) {
      this.log(`File not found: ${name}.dhero`);
      return;
    }

    const file = JSON.parse(raw);

    document.getElementById("editor").value = file.code;
    document.getElementById("bankSelect").value = file.bank;
    document.getElementById("dimSelect").value = file.dimension;

    this.state.bank = file.bank;
    this.state.dimension = file.dimension;
    this.state.config = file.config || {};
    this.state.currentFile = name;

    this.log(`Loaded ${name}.dhero`);
    this.setStatus("Loaded.");
  },

  run() {
    const code = document.getElementById("editor").value;

    this.parseEEJONSLEX();
    this.runEEJS();

    const dim = this.state.dimension;

    const dimStyle = `
      <style>
        body { margin:0; font-family:system-ui; color:#e6ecff; }
        .dim3  { transform: perspective(800px) rotateY(0deg); }
        .dim4  { transform: perspective(800px) rotateY(18deg); filter:hue-rotate(40deg); }
        .dim10 { transform: perspective(800px) rotateY(35deg) skewX(8deg); filter:hue-rotate(120deg) saturate(1.4); }
      </style>
    `;

    const wrapped = `
      <html>
        <head>${dimStyle}</head>
        <body class="dim${dim}">
          ${code}
        </body>
      </html>
    `;

    document.getElementById("previewFrame").srcdoc = wrapped;

    this.log(`RUN → Preview (Bank ${this.state.bank}, ${dim}D).`);
    this.setStatus(`Preview updated • Bank ${this.state.bank} • ${dim}D`);
  }
};

window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("editor").value =
`<!--EEJONSLEX
{
  "project": "ENASTO_DEMO",
  "ritual": "CORE_IGNITE",
  "universe": "MARS"
}
EEJONSLEX-->

<h1>ENASTO HTMLJSCSSC++</h1>
<p>Running inside EEUKOSUI • ENASTO 128 TB BASIC SYSTEM.</p>`;
});
</script>

</body>
